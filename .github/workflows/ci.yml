name: repo-baseline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Check baseline files
        run: |
          test -f README.md
          test -f SECURITY.md
          test -f CODEOWNERS -o -f .github/CODEOWNERS
          test -f renovate.json -o -f .github/renovate.json
          test -f socket.yml -o -f .socket.yml
          test -f .infisical.json
          test -f .env.example

      - name: Check real env files are absent
        run: |
          if find . -path ./.git -prune -o -type f \( -name '.env' -o -name '.env.local' -o -name '.env.development' -o -name '.env.production' \) -print | grep .; then
            echo "Real .env files must not be committed"
            exit 1
          fi
